# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - timeledger-jeff

on:
  push:
    branches:
      - 'azure'
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Lint frontend
        working-directory: client
        run: npm run lint

      - name: Build frontend
        working-directory: client
        env:
          VITE_USE_MOCKS: 'false'
          VITE_API_BASE_URL: '/api'
        run: npm run build

      - name: Copy frontend into API
        shell: pwsh
        run: |
          $webRoot = "server/TimeLedger.Api/TimeLedger.Api/wwwroot"
          New-Item -ItemType Directory -Force -Path $webRoot
          Copy-Item -Path "client/dist/*" -Destination $webRoot -Recurse -Force

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        run: >
          dotnet publish
          server/TimeLedger.Api/TimeLedger.Api/TimeLedger.Api.csproj
          --configuration Release
          --output ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_51281B17020146FE8A8B43EADEAB7818 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_67345E0CDCF74BCDA148D2EFC5FBAC7B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AD1BE04777CC4CF1963B61FFBD736EE4 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'timeledger-jeff'
          slot-name: 'Production'
          package: .
          